<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,600;0,6..96,700&amp;family=Manrope:wght@500;600&amp;display=swap');
      .brand-title {
        font-family: 'Bodoni Moda', serif;
        font-weight: 700;
        font-size: 44px;
        letter-spacing: 0.12em;
        fill: #4A102A;
      }
      .brand-title-light {
        font-family: 'Bodoni Moda', serif;
        font-weight: 700;
        font-size: 44px;
        letter-spacing: 0.12em;
        fill: #F6F0E8;
      }
      .brand-tagline {
