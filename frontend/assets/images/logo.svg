        font-weight: 600;
        font-size: 10px;
        letter-spacing: 0.35em;
        fill: #C5A46D;
      }
      .brand-tagline-muted {
        font-family: 'Manrope', sans-serif;
        font-weight: 500;
        font-size: 9.5px;
        letter-spacing: 0.32em;
        fill: #181619;
        opacity: 0.75;
      }
    </style>
  </defs>
  <!-- DÉLICE Wordmark -->
  <text x="160" y="44" text-anchor="middle" class="brand-title">DÉLICE</text>
  <text x="160" y="66" text-anchor="middle" class="brand-tagline">MAKE IT YOURS.</text>
