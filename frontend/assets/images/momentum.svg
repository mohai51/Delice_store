<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 750" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlowMomentum" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#F4EFE9" />
      <stop offset="100%" stop-color="#DDD3C5" />
    </radialGradient>

    <!-- Glass Bottle Gradient -->
    <linearGradient id="glassWallM" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.7)" />
      <stop offset="15%" stop-color="rgba(255,255,255,0.25)" />
      <stop offset="50%" stop-color="rgba(255,255,255,0.05)" />
      <stop offset="85%" stop-color="rgba(255,255,255,0.25)" />
      <stop offset="100%" stop-color="rgba(190,180,170,0.5)" />
    </linearGradient>

    <!-- Liquid Hue (Crisp Energetic Golden Amber for Momentum) -->
    <linearGradient id="liquidMomentum" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDF1D6" />
      <stop offset="50%" stop-color="#EED397" />
      <stop offset="100%" stop-color="#D4A759" />
    </linearGradient>

    <!-- Cap Metal Gradient (Obsidian Ink with Gold Rim) -->
    <linearGradient id="capInk" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#181619" />
      <stop offset="35%" stop-color="#2D282D" />
      <stop offset="65%" stop-color="#181619" />
      <stop offset="100%" stop-color="#0E0D0F" />
    </linearGradient>

    <linearGradient id="goldTrimM" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9C7738" />
      <stop offset="50%" stop-color="#F2D79E" />
      <stop offset="100%" stop-color="#9C7738" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="bottleShadowM" x="-20%" y="-10%" width="140%" height="140%">
      <feDropShadow dx="0" dy="35" stdDeviation="25" flood-color="#181619" flood-opacity="0.18" />
    </filter>
    <filter id="softBlurM" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" />
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="600" height="750" fill="url(#bgGlowMomentum)" />

  <!-- Pedestal / Surface Shadow -->
  <ellipse cx="300" cy="655" rx="160" ry="18" fill="#181619" opacity="0.19" filter="url(#softBlurM)" />
  <ellipse cx="300" cy="650" rx="110" ry="8" fill="#4A102A" opacity="0.16" filter="url(#softBlurM)" />

  <!-- Perfume Bottle Group -->
  <g filter="url(#bottleShadowM)">
    <!-- Base Glass Glow -->
    <rect x="210" y="270" width="180" height="360" rx="20" fill="url(#liquidMomentum)" />

    <!-- Glass Liquid Wave / Fill Level -->
    <path d="M 210 318 Q 300 312 390 318 L 390 610 Q 390 630 370 630 L 230 630 Q 210 630 210 610 Z" fill="url(#liquidMomentum)" opacity="0.95" />

    <!-- Internal Dip Tube -->
    <line x1="300" y1="260" x2="300" y2="618" stroke="rgba(255,255,255,0.75)" stroke-width="3" stroke-linecap="round" />
    <line x1="299" y1="260" x2="299" y2="618" stroke="rgba(24,22,25,0.3)" stroke-width="1.5" />

    <!-- Glass Thickness Outer Shell -->
    <rect x="205" y="260" width="190" height="375" rx="22" fill="none" stroke="url(#glassWallM)" stroke-width="10" />

    <!-- Front Luxury Label (Clean Ivory with Ink Border) -->
    <rect x="235" y="365" width="130" height="175" rx="4" fill="#FDFBF7" stroke="#181619" stroke-width="1.2" />
    <rect x="239" y="369" width="122" height="167" rx="2" fill="none" stroke="#C5A46D" stroke-width="0.8" opacity="0.5" />

    <!-- Label Typography -->
    <text x="300" y="405" font-family="'Bodoni Moda', Georgia, serif" font-weight="700" font-size="20" fill="#181619" text-anchor="middle" letter-spacing="2.5">DÉLICE</text>
    <text x="300" y="422" font-family="'Manrope', sans-serif" font-weight="600" font-size="7" fill="#4A102A" text-anchor="middle" letter-spacing="3">MAKE IT YOURS.</text>
    <line x1="260" y1="438" x2="340" y2="438" stroke="#181619" stroke-width="0.75" />
    <text x="300" y="470" font-family="'Bodoni Moda', Georgia, serif" font-weight="700" font-size="16" fill="#181619" text-anchor="middle" letter-spacing="2">MOMENTUM</text>
    <text x="300" y="492" font-family="'Manrope', sans-serif" font-weight="500" font-size="8" fill="#4A102A" text-anchor="middle" letter-spacing="1.5">EAU DE PARFUM</text>
    <text x="300" y="515" font-family="'Manrope', sans-serif" font-weight="600" font-size="8.5" fill="#181619" text-anchor="middle" letter-spacing="2">30 ml</text>

    <!-- Glass Reflections and Specular Sheen -->
    <path d="M 215 275 L 225 275 L 225 615 L 215 615 Z" fill="#FFFFFF" opacity="0.5" />
    <path d="M 378 285 L 382 285 L 382 605 L 378 605 Z" fill="#FFFFFF" opacity="0.3" />

    <!-- Atomizer Neck / Collar -->
    <rect x="272" y="235" width="56" height="26" rx="3" fill="url(#goldTrimM)" stroke="#9C7738" stroke-width="0.5" />
    <rect x="276" y="240" width="48" height="5" fill="#FFF2D6" opacity="0.7" />

    <!-- Bottle Heavy Solid Cap (Ink Black with Gold Trim) -->
    <rect x="260" y="145" width="80" height="90" rx="8" fill="url(#capInk)" />
    <rect x="260" y="228" width="80" height="7" fill="url(#goldTrimM)" />
    <!-- Cap Reflection Highlight -->
    <path d="M 266 148 L 274 148 L 274 228 L 266 228 Z" fill="#FFFFFF" opacity="0.22" />
    <circle cx="300" cy="180" r="14" fill="none" stroke="#C5A46D" stroke-width="1.2" />
    <text x="300" y="185" font-family="'Bodoni Moda', serif" font-weight="700" font-size="14" fill="#C5A46D" text-anchor="middle">D</text>
  </g>

  <!-- Badge: 30ml / Opening Offer -->
  <g transform="translate(420, 170)">
    <circle cx="35" cy="35" r="35" fill="#181619" />
    <circle cx="35" cy="35" r="32" fill="none" stroke="#C5A46D" stroke-width="1" />
    <text x="35" y="28" font-family="'Manrope', sans-serif" font-weight="700" font-size="9" fill="#F6F0E8" text-anchor="middle" letter-spacing="1">OFFER</text>
    <text x="35" y="46" font-family="'Bodoni Moda', serif" font-weight="700" font-size="16" fill="#C5A46D" text-anchor="middle">৳799</text>
  </g>
</svg>
