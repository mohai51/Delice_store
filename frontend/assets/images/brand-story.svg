<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="100%" height="100%">
  <defs>
    <radialGradient id="storyBg" cx="40%" cy="40%" r="75%">
      <stop offset="0%" stop-color="#5E1837" />
      <stop offset="60%" stop-color="#4A102A" />
      <stop offset="100%" stop-color="#2D0618" />
    </radialGradient>
    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EED397" />
      <stop offset="100%" stop-color="#9C7738" />
    </linearGradient>
    <filter id="storyBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" />
    </filter>
  </defs>

  <rect width="800" height="1000" fill="url(#storyBg)" />
  <circle cx="500" cy="300" r="260" fill="#C5A46D" opacity="0.15" filter="url(#storyBlur)" />
  <circle cx="250" cy="700" r="220" fill="#FF665C" opacity="0.12" filter="url(#storyBlur)" />

  <!-- Frame border with refined luxury margins -->
  <rect x="35" y="35" width="730" height="930" fill="none" stroke="#C5A46D" stroke-width="1" opacity="0.4" />
  <rect x="43" y="43" width="714" height="914" fill="none" stroke="#C5A46D" stroke-width="0.5" stroke-dasharray="4 4" opacity="0.3" />

  <!-- Monogram Watermark in background -->
  <text x="400" y="580" font-family="'Bodoni Moda', serif" font-weight="700" font-size="360" fill="#FFFFFF" opacity="0.03" text-anchor="middle">D</text>

  <!-- Editorial Bottle Still Life -->
  <g transform="translate(300, 260)">
    <rect x="0" y="160" width="200" height="380" rx="20" fill="#F8E5D8" opacity="0.95" />
    <rect x="-6" y="150" width="212" height="400" rx="22" fill="none" stroke="#FFFFFF" stroke-width="7" opacity="0.35" />
    <rect x="35" y="270" width="130" height="170" fill="#FDFBF7" rx="3" stroke="#C5A46D" stroke-width="1" />
    <text x="100" y="310" font-family="'Bodoni Moda', serif" font-weight="700" font-size="20" fill="#4A102A" text-anchor="middle">DÉLICE</text>
    <text x="100" y="330" font-family="'Manrope', sans-serif" font-weight="600" font-size="7" fill="#C5A46D" text-anchor="middle" letter-spacing="3">MAKE IT YOURS.</text>
    <text x="100" y="375" font-family="'Bodoni Moda', serif" font-weight="700" font-size="16" fill="#181619" text-anchor="middle">EAU DE PARFUM</text>
    <text x="100" y="405" font-family="'Manrope', sans-serif" font-weight="600" font-size="9" fill="#4A102A" text-anchor="middle">30 ml</text>
    <rect x="60" y="45" width="80" height="105" rx="8" fill="#4A102A" />
    <rect x="60" y="150" width="80" height="12" fill="url(#goldAccent)" />
    <circle cx="100" cy="95" r="14" fill="none" stroke="#C5A46D" stroke-width="1.2" />
    <text x="100" y="100" font-family="'Bodoni Moda', serif" font-weight="700" font-size="14" fill="#C5A46D" text-anchor="middle">D</text>
  </g>

  <!-- Quote from Brand Book Page 3 -->
  <g transform="translate(100, 780)">
    <text x="300" y="0" font-family="'Bodoni Moda', serif" font-style="italic" font-weight="500" font-size="22" fill="#F6F0E8" text-anchor="middle">"The moments we remember are not always the biggest ones."</text>
    <text x="300" y="35" font-family="'Manrope', sans-serif" font-weight="500" font-size="13" fill="#C5A46D" text-anchor="middle" letter-spacing="2">DÉLICE — MAKE IT YOURS.</text>
  </g>
</svg>
