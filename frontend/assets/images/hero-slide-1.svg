<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="100%" height="100%">
  <defs>
    <radialGradient id="hero1Grad" cx="70%" cy="50%" r="80%">
      <stop offset="0%" stop-color="#3A0A20" />
      <stop offset="45%" stop-color="#4A102A" />
      <stop offset="85%" stop-color="#230613" />
      <stop offset="100%" stop-color="#181619" />
    </radialGradient>
    <linearGradient id="warmLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF665C" stop-opacity="0.25" />
      <stop offset="50%" stop-color="#C5A46D" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.8" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="40" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1600" height="900" fill="url(#hero1Grad)" />
  <rect width="1600" height="900" fill="url(#warmLight)" />

  <!-- Abstract Atmospheric Luxury Shapes (Drape / Velvet / Warm light) -->
  <circle cx="1150" cy="380" r="320" fill="#C5A46D" opacity="0.12" filter="url(#softGlow)" />
  <circle cx="1300" cy="550" r="280" fill="#FF665C" opacity="0.10" filter="url(#softGlow)" />
  <path d="M 850 900 C 1000 650, 1150 450, 1600 400 L 1600 900 Z" fill="#250514" opacity="0.6" />

  <!-- Hero Editorial Fragrance Bottle Silhouettes on right side -->
  <g transform="translate(1000, 180) scale(0.9)">
    <!-- BLOOM & MOMENTUM silhouettes -->
    <!-- Main Center Bottle (Bloom) -->
    <rect x="130" y="220" width="160" height="320" rx="16" fill="#F8E5D8" opacity="0.9" />
    <rect x="125" y="210" width="170" height="335" rx="18" fill="none" stroke="#FFFFFF" stroke-width="8" opacity="0.4" />
    <!-- Label -->
    <rect x="155" y="310" width="110" height="150" fill="#FDFBF7" rx="3" />
    <text x="210" y="350" font-family="'Bodoni Moda', serif" font-weight="700" font-size="18" fill="#4A102A" text-anchor="middle">DÉLICE</text>
    <text x="210" y="395" font-family="'Bodoni Moda', serif" font-weight="600" font-size="14" fill="#181619" text-anchor="middle">BLOOM</text>
    <text x="210" y="430" font-family="'Manrope', sans-serif" font-weight="600" font-size="9" fill="#C5A46D" text-anchor="middle">30 ml</text>
    <!-- Cap -->
    <rect x="175" y="105" width="70" height="85" rx="6" fill="#4A102A" />
    <rect x="175" y="190" width="70" height="15" fill="#C5A46D" />

    <!-- Secondary Accompanying Bottle (Momentum) slightly behind -->
    <g transform="translate(-110, 40) scale(0.85)" opacity="0.75">
      <rect x="130" y="220" width="160" height="320" rx="16" fill="#F2D79E" opacity="0.85" />
      <rect x="155" y="310" width="110" height="150" fill="#FDFBF7" rx="3" />
      <text x="210" y="350" font-family="'Bodoni Moda', serif" font-weight="700" font-size="18" fill="#181619" text-anchor="middle">DÉLICE</text>
      <text x="210" y="395" font-family="'Bodoni Moda', serif" font-weight="600" font-size="13" fill="#181619" text-anchor="middle">MOMENTUM</text>
      <rect x="175" y="105" width="70" height="85" rx="6" fill="#181619" />
      <rect x="175" y="190" width="70" height="15" fill="#C5A46D" />
    </g>
  </g>

  <!-- Editorial Typography Overlay Graphic -->
  <g transform="translate(120, 240)">
    <text x="0" y="0" font-family="'Manrope', sans-serif" font-weight="600" font-size="14" fill="#C5A46D" letter-spacing="4">THE NEW EAU DE PARFUM EDITIONS</text>
    <text x="0" y="70" font-family="'Bodoni Moda', Georgia, serif" font-weight="700" font-size="64" fill="#F6F0E8" letter-spacing="1">Make It</text>
    <text x="0" y="145" font-family="'Bodoni Moda', Georgia, serif" font-style="italic" font-weight="500" font-size="68" fill="#C5A46D" letter-spacing="1">Yours.</text>
    <text x="0" y="210" font-family="'Manrope', sans-serif" font-weight="400" font-size="18" fill="#F6F0E8" opacity="0.85" max-width="500">
      <tspan x="0" dy="0">Romantic in feeling. Bold in self-expression.</tspan>
      <tspan x="0" dy="28">Attainable luxury crafted for everyday confidence.</tspan>
    </text>

    <!-- Editorial Badges -->
    <g transform="translate(0, 280)">
      <rect width="160" height="38" rx="19" fill="rgba(246, 240, 232, 0.12)" stroke="#C5A46D" stroke-width="1" />
      <text x="80" y="24" font-family="'Manrope', sans-serif" font-weight="600" font-size="12" fill="#F6F0E8" text-anchor="middle" letter-spacing="1">30ml EAU DE PARFUM</text>
      <rect x="180" width="180" height="38" rx="19" fill="#FF665C" />
      <text x="270" y="24" font-family="'Manrope', sans-serif" font-weight="700" font-size="12" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">OPENING OFFER ৳799</text>
    </g>
  </g>
</svg>
