<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="100%" height="100%">
  <defs>
    <radialGradient id="hero2Grad" cx="35%" cy="50%" r="85%">
      <stop offset="0%" stop-color="#2D121F" />
      <stop offset="60%" stop-color="#1E0B15" />
      <stop offset="100%" stop-color="#12060D" />
    </radialGradient>
    <filter id="softGlow2" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="50" />
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#hero2Grad)" />
  <circle cx="1000" cy="450" r="350" fill="#C5A46D" opacity="0.1" filter="url(#softGlow2)" />
  <circle cx="400" cy="300" r="220" fill="#4A102A" opacity="0.4" filter="url(#softGlow2)" />

  <!-- Tri-bottle composition in background -->
  <g transform="translate(850, 200) scale(0.85)">
    <!-- BLOOM -->
    <g transform="translate(0, 40)">
      <rect x="0" y="160" width="140" height="280" rx="14" fill="#FDE8E1" opacity="0.85" />
      <rect x="0" y="150" width="140" height="295" rx="14" fill="none" stroke="#FFFFFF" stroke-width="6" opacity="0.4" />
      <rect x="20" y="230" width="100" height="130" fill="#FFFDFB" rx="3" />
      <text x="70" y="270" font-family="'Bodoni Moda', serif" font-weight="700" font-size="14" fill="#4A102A" text-anchor="middle">DÉLICE</text>
      <text x="70" y="305" font-family="'Bodoni Moda', serif" font-weight="600" font-size="12" fill="#181619" text-anchor="middle">BLOOM</text>
      <rect x="40" y="65" width="60" height="80" rx="5" fill="#4A102A" />
      <rect x="40" y="145" width="60" height="12" fill="#C5A46D" />
    </g>

    <!-- ENIGMA (Center, elevated) -->
    <g transform="translate(160, 0)">
      <rect x="0" y="160" width="150" height="300" rx="14" fill="#E8B482" opacity="0.9" />
      <rect x="0" y="150" width="150" height="315" rx="14" fill="none" stroke="#FFFFFF" stroke-width="6" opacity="0.5" />
      <rect x="25" y="235" width="100" height="135" fill="#4A102A" rx="3" />
      <text x="75" y="275" font-family="'Bodoni Moda', serif" font-weight="700" font-size="14" fill="#F6F0E8" text-anchor="middle">DÉLICE</text>
      <text x="75" y="310" font-family="'Bodoni Moda', serif" font-weight="600" font-size="12" fill="#C5A46D" text-anchor="middle">ENIGMA</text>
      <rect x="45" y="60" width="60" height="85" rx="5" fill="#C5A46D" />
      <rect x="45" y="145" width="60" height="12" fill="#4A102A" />
    </g>

    <!-- MOMENTUM -->
    <g transform="translate(330, 40)">
      <rect x="0" y="160" width="140" height="280" rx="14" fill="#F1DC9E" opacity="0.85" />
      <rect x="0" y="150" width="140" height="295" rx="14" fill="none" stroke="#FFFFFF" stroke-width="6" opacity="0.4" />
      <rect x="20" y="230" width="100" height="130" fill="#FFFDFB" rx="3" />
      <text x="70" y="270" font-family="'Bodoni Moda', serif" font-weight="700" font-size="14" fill="#181619" text-anchor="middle">DÉLICE</text>
      <text x="70" y="305" font-family="'Bodoni Moda', serif" font-weight="600" font-size="12" fill="#181619" text-anchor="middle">MOMENTUM</text>
      <rect x="40" y="65" width="60" height="80" rx="5" fill="#181619" />
      <rect x="40" y="145" width="60" height="12" fill="#C5A46D" />
    </g>
  </g>

  <!-- Editorial Copy -->
  <g transform="translate(120, 250)">
    <text x="0" y="0" font-family="'Manrope', sans-serif" font-weight="600" font-size="13" fill="#C5A46D" letter-spacing="4">THE THREE SIGNATURE MOODS</text>
    <text x="0" y="70" font-family="'Bodoni Moda', Georgia, serif" font-weight="700" font-size="58" fill="#F6F0E8" letter-spacing="1">A Fragrance for</text>
    <text x="0" y="145" font-family="'Bodoni Moda', Georgia, serif" font-style="italic" font-weight="500" font-size="64" fill="#F6F0E8" letter-spacing="1">Every Side of You.</text>
    <text x="0" y="210" font-family="'Manrope', sans-serif" font-weight="400" font-size="18" fill="#F6F0E8" opacity="0.85">
      <tspan x="0" dy="0">From morning campus classes to midnight celebrations,</tspan>
      <tspan x="0" dy="28">explore the 30ml collection designed for your life in motion.</tspan>
    </text>

    <g transform="translate(0, 280)">
      <rect width="210" height="42" rx="21" fill="#4A102A" stroke="#C5A46D" stroke-width="1.2" />
      <text x="105" y="26" font-family="'Manrope', sans-serif" font-weight="600" font-size="13" fill="#F6F0E8" text-anchor="middle" letter-spacing="1">EXPLORE COLLECTION</text>
    </g>
  </g>
</svg>
